name: Metrologic finite-law mathematical operations
on:
  push:
    paths:
      - 'lib/metrologic/src/number/finite-law.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/laplacian.mjs'
      - 'lib/metrologic/test/number/oriented-incidence.test.mjs'
      - 'lib/metrologic/test/number/finite-law.test.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/chromatic-lorentzian.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal-mobius.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal.mjs'
      - 'lib/metrologic/test/causal-mobius.test.mjs'
      - 'lib/metrologic/test/causal-kinematic.test.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-condensate.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-graph.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-thread-routing.mjs'
      - 'lib/metrologic/test/port-thread-routing.test.mjs'
      - 'lib/metrologic/test/port-thread-connectivity.test.mjs'
      - 'lib/metrologic/test/port-thread-material-length.test.mjs'
      - 'lib/metrologic/test/chromatic-lorentzian.test.mjs'
      - 'lib/metrologic/src/obstruction/capacity-flow.mjs'
      - 'lib/metrologic/test/capacity-flow.test.mjs'
      - 'lib/metrologic/package.json'
      - 'services/number-services-section/services/exact-number-data-service/src/resource-measurement.mjs'
      - 'services/number-services-section/services/exact-number-data-service/src/framework-rigidity.mjs'
      - 'services/number-services-section/services/exact-number-data-service/test/resource-measurement.test.mjs'
      - 'services/number-services-section/services/exact-number-data-service/test/framework-rigidity.test.mjs'
      - 'services/number-services-section/services/exact-number-data-service/package.json'
      - '.github/workflows/metrologic-finite-law.yml'
  pull_request:
    paths:
      - 'lib/metrologic/src/number/finite-law.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/laplacian.mjs'
      - 'lib/metrologic/test/number/oriented-incidence.test.mjs'
      - 'lib/metrologic/test/number/finite-law.test.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/chromatic-lorentzian.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal-mobius.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal.mjs'
      - 'lib/metrologic/test/causal-mobius.test.mjs'
      - 'lib/metrologic/test/causal-kinematic.test.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-condensate.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-graph.mjs'
      - 'lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-thread-routing.mjs'
      - 'lib/metrologic/test/port-thread-routing.test.mjs'
      - 'lib/metrologic/test/port-thread-connectivity.test.mjs'
      - 'lib/metrologic/test/port-thread-material-length.test.mjs'
      - 'lib/metrologic/test/chromatic-lorentzian.test.mjs'
      - 'lib/metrologic/src/obstruction/capacity-flow.mjs'
      - 'lib/metrologic/test/capacity-flow.test.mjs'
      - 'lib/metrologic/package.json'
      - 'services/number-services-section/services/exact-number-data-service/src/resource-measurement.mjs'
      - 'services/number-services-section/services/exact-number-data-service/src/framework-rigidity.mjs'
      - 'services/number-services-section/services/exact-number-data-service/test/resource-measurement.test.mjs'
      - 'services/number-services-section/services/exact-number-data-service/test/framework-rigidity.test.mjs'
      - 'services/number-services-section/services/exact-number-data-service/package.json'
      - '.github/workflows/metrologic-finite-law.yml'
permissions:
  contents: read
jobs:
  finite-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generic finite-law source
        run: node --check lib/metrologic/src/number/finite-law.mjs
      - name: Check exact directed-incidence algebra syntax
        run: node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/laplacian.mjs
      - name: Verify total-variation extrema and mass-weighted tails
        run: node --test lib/metrologic/test/number/finite-law.test.mjs
      - name: Verify exact capacity-flow/min-cut and source-graph conservation
        run: |
          node --check lib/metrologic/src/obstruction/capacity-flow.mjs
          node --test lib/metrologic/test/capacity-flow.test.mjs
      - name: Verify actual finite causal Möbius coefficients against the exhaustive independent poset oracle
        run: |
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal-mobius.mjs
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal.mjs
          node --test lib/metrologic/test/causal-mobius.test.mjs
      - name: Verify causal-diamond K(C) strand optimality against exhaustive antichain oracle
        run: |
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/causal.mjs
          node --check lib/metrologic/test/causal-kinematic.test.mjs
          node --test lib/metrologic/test/causal-kinematic.test.mjs
      - name: Verify finite chromatic motion and exact integer guards
        run: |
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/chromatic-lorentzian.mjs
          node --test lib/metrologic/test/chromatic-lorentzian.test.mjs


  bead-port-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise actual data-owned FOUR and port-routing source without a remote registry
        run: |
          set -euo pipefail
          # The source checkout is itself the Data owner's package; resolve
          # its own public FOUR export without a competing implementation.
          mkdir -p node_modules/@red-cup-engineering
          ln -s "$GITHUB_WORKSPACE" node_modules/@red-cup-engineering/computer-data-engineering-services-section
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-condensate.mjs
          node --check lib/metrologic/src/articulation/predicating/positing/settling/analysis/port-thread-routing.mjs
          node --check lib/metrologic/test/port-thread-routing.test.mjs
          node --check lib/metrologic/test/port-thread-connectivity.test.mjs
          node --check lib/metrologic/test/port-thread-material-length.test.mjs
          node --test lib/metrologic/test/port-thread-routing.test.mjs lib/metrologic/test/port-thread-connectivity.test.mjs lib/metrologic/test/port-thread-material-length.test.mjs
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('lib/metrologic/package.json','utf8'));
          assert.equal(
            pkg.exports['./articulation/predicating/positing/settling/analysis/port-thread-routing'].import,
            './src/articulation/predicating/positing/settling/analysis/port-thread-routing.mjs'
          );
          NODE

  graded-resource-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing graded number and dimensioned resource admission
        run: |
          node --check services/number-services-section/services/exact-number-data-service/src/resource-measurement.mjs
          node --test services/number-services-section/services/exact-number-data-service/test/commodity-carrier.test.mjs services/number-services-section/services/exact-number-data-service/test/resource-measurement.test.mjs
      - name: Fabricate exact-coordinate planar and three-dimensional contact-rigidity readouts
        run: |
          node --check services/number-services-section/services/exact-number-data-service/src/framework-rigidity.mjs
          node --test services/number-services-section/services/exact-number-data-service/test/rational-matrix.test.mjs services/number-services-section/services/exact-number-data-service/test/framework-rigidity.test.mjs
      - name: Verify canonical exact-number package interface
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('services/number-services-section/services/exact-number-data-service/package.json','utf8'));
          assert.equal(p.exports['./resource-measurement'],'./src/resource-measurement.mjs');
          assert.equal(p.exports['./graded'],'./src/graded.mjs');
          assert.equal(p.exports['./framework-rigidity'],'./src/framework-rigidity.mjs');
          NODE
