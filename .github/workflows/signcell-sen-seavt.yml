name: SignCell SEN SEAVT native presentation

on:
  push:
    paths:
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/admit-seavt-row.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/clock.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/clock.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/signcell-seavt.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/causal-resource-head.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/causal-resource-head.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/package.json'
      - 'apps/signcell/src/semantic-claim.mjs'
      - 'apps/signcell/src/cell.mjs'
      - 'apps/signcell/test/semantic-claim.test.mjs'
      - 'src/four.mjs'
      - 'test/four.test.mjs'
      - '.github/workflows/signcell-sen-seavt.yml'
  pull_request:
    paths:
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/admit-seavt-row.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/clock.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/clock.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/signcell-seavt.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/causal-resource-head.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/causal-resource-head.test.mjs'
      - 'services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/package.json'
      - 'apps/signcell/src/semantic-claim.mjs'
      - 'apps/signcell/src/cell.mjs'
      - 'apps/signcell/test/semantic-claim.test.mjs'
      - 'src/four.mjs'
      - 'test/four.test.mjs'
      - '.github/workflows/signcell-sen-seavt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual native SignCell projection and test source syntax
        run: |
          node --check services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/admit-seavt-row.mjs
          node --check services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/signcell-seavt.test.mjs
          node --check services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/causal-resource-head.mjs
          node --check services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/causal-resource-head.test.mjs
      - name: Check actual SignCell semantic claim and witness test syntax
        run: |
          node --check apps/signcell/src/semantic-claim.mjs
          node --check apps/signcell/src/cell.mjs
          node --check apps/signcell/test/semantic-claim.test.mjs
      - name: Execute the existing dependency-free FOUR value algebra conformance
        run: node --test test/four.test.mjs
      - name: Require native workspace consumer and supplier in the dependency contract
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/package.json"));
            if (p.dependencies["@red-cup-engineering/signcell"]!=="workspace:*")
              throw new Error("SEAVT must consume the actual SignCell supplier");
            if (p.exports["./causal-resource-head"]!=="./src/causal-resource-head.mjs")
              throw new Error("canonical SEAVT causal resource-head export missing");
            if (p.exports["./admit-seavt-row"]!=="./src/admit-seavt-row.mjs")
              throw new Error("canonical SEN-SEAVT provider export missing");
          '

  exact-clock-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact SEAVT clock conformance (dependency-free source)
        run: |
          node --check services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/src/clock.mjs
          node --test services/computer-content-engineering-services-section/services/computer-serialized-content-engineering-services-section/services/json-services-section/services/jsonl-services-section/services/eavt-services-section/services/semiotic-eavt-services-section/test/clock.test.mjs
