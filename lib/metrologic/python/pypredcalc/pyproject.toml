[project]
name = "pypredcalc"
version = "0.2.6"
description = "Pure-math primitives for predication-native computation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "bilattice",
    "predication",
    "sheaf",
    "poset",
    "category-theory",
    "logic",
    "substitution-dynamics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
symbolic = [
    "sympy>=1.12",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.8",
    "ruff>=0.5",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypredcalc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
# Coverage flags are opt-in (CI enables them explicitly) so the test
# suite runs in environments where ``pytest-cov`` is not installed.
# To run with coverage locally:
#   pytest --cov=pypredcalc --cov-report=term-missing --cov-report=xml --cov-fail-under=90

[tool.coverage.run]
branch = true
source = ["pypredcalc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.mypy]
strict = true
files = ["src/pypredcalc"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701", "E731", "E741", "B018"]
